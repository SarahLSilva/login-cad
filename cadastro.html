<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Cadastro</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='cadastro.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>   
    /* Reset básico para garantir uma aparência consistente entre navegadores */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Corpo da página */
body {
    font-family: Arial, sans-serif;
    background-image: url(img/20100.jpg);
    color: #333; /* Cor do texto */
}

/* Container geral para o formulário e a tabela */
.container {
    width: 80%;
    max-width: 800px;
    margin: 20px auto; /* Centraliza o container e adiciona margem */
    padding: 20px;
    background-color: #ffffff; /* Fundo branco para o container */
    border-radius: 8px; /* Bordas arredondadas */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra leve para profundidade */
}

/* Estilo para os cabeçalhos */
h1 {
    color: #007bff; /* Cor azul para os cabeçalhos */
    margin-bottom: 15px;
}

/* Estilo para os rótulos */
label {
    display: block; /* Faz com que os rótulos ocupem a linha inteira */
    margin-bottom: 5px;
    font-weight: bold;
}

/* Estilo para os inputs */
input.form-control {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ced4da;
    border-radius: 4px;
}

/* Estilo para o botão */
button.btn-success {
    background-color: #3f28a7; /* Cor verde para o botão */
    border-color: #3f28a7;
    color: white;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 16px;
}

button.btn-success:hover {
    background-color: #2b2188; /* Cor verde escura ao passar o mouse */
    border-color: #241e7e;
}

/* Estilo para a tabela */
.table {
    width: 100%;
    border-collapse: collapse; /* Remove espaçamento entre as células */
}

.table th, .table td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #dee2e6; /* Linha de divisão entre as linhas da tabela */
}

.table th {
    background-color: #f1f1f1; /* Cor de fundo para o cabeçalho da tabela */
}

.table-striped tbody tr:nth-of-type(odd) {
    background-color: #f9f9f9; /* Cor de fundo alternada para linhas ímpares */
}
   
    </style>
</head>
<body>
    <div class="container">
        <h1>Nome:</h1>
        <label for="" Nome:></label>
        <input type="text" id="nomeUser" class="form-control"><br>
        <h1>E-mail:</h1>
        <label for="" E-mail:></label>
        <input type="text" id="emailUser" class="form-control"><br>
        <button type="button" onclick="salvarUser()" class="btn btn-success">SALVAR</button>
    </div>
    <br>
    <div class="container">
        <table class="table table-striped" id="table">
            <tr>
                <th>Nome Usuário</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </table>
    </div>
    <script src="controller.js"></script>
</body>
</html>
